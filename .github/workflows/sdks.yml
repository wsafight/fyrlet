name: SDKs

# Unit builds/tests for every SDK. Integration suites stay skipped here: they need a
# running server (INTEGRATION_ENDPOINT / INTEGRATION_FIXTURES), which the Core workflow
# already covers for TypeScript/React. Each job runs only when the SDKs change.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['sdks/**', '.github/workflows/sdks.yml']
  pull_request:
    branches: [main]
    paths: ['sdks/**', '.github/workflows/sdks.yml']

permissions:
  contents: read

concurrency:
  group: sdks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: sdks/go/go.sum
      - run: go vet ./...
      - run: go test ./...

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sdks/python/pyproject.toml
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdks/rust
      - run: cargo test --locked

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -q test

  kotlin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/kotlin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -q test

  dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/dotnet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet test Fyrlet.sln --nologo

  swift:
    # The package builds with the Swift toolchain bundled in Xcode on the macOS runners.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: swift test --package-path sdks/swift
