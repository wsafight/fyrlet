name: Core

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RESTORE_DOCKER: '1'
      # Keep boot crashes diagnosable instead of a 5 MB dump in an unknown directory.
      ERL_CRASH_DUMP: /home/runner/work/_temp/erl_crash.dump
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: '1.18'
            otp: '27'
          - elixir: '1.20'
            otp: '29'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            sdks/typescript/package-lock.json
            sdks/react/package-lock.json
            examples/inbox-react/package-lock.json
      - name: Cache Elixir dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            _build
            deps
            ~/.hex
            ~/.mix
            examples/*/_build
            examples/*/deps
            packages/*/_build
            packages/*/deps
          key: beam-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock', 'examples/*/mix.lock', 'packages/*/mix.lock') }}
          restore-keys: beam-${{ matrix.elixir }}-${{ matrix.otp }}-
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('examples/inbox-react/package-lock.json') }}
          restore-keys: playwright-
      - name: Install dependencies
        run: |
          mix deps.get
          for project in examples/*/ packages/fyrlet_*/; do
            [[ -f "$project/mix.exs" ]] || continue
            (cd "$project" && mix deps.get)
          done
          npm --prefix sdks/typescript ci
          npm --prefix sdks/react ci
          npm --prefix examples/inbox-react ci
      - name: Install browser
        run: cd examples/inbox-react && npx playwright install --with-deps chromium
      - name: Run frozen-source acceptance
        run: >-
          node scripts/acceptance.mjs
          --groups core,client,host,bench,contract,integration,restore,browser
          --out .local/readiness/ci
      - name: Validate Prometheus alert rules
        run: >-
          docker run --rm -v "$PWD/deploy/prometheus:/rules:ro"
          --entrypoint /bin/promtool prom/prometheus:v3.1.0
          check rules /rules/alerts.yml
      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.elixir }}-${{ matrix.otp }}
          path: .local/readiness/ci/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.elixir }}-${{ matrix.otp }}
          path: |
            .local/integration/*.log
            .local/readiness/**
            /home/runner/work/_temp/erl_crash.dump
          include-hidden-files: true
          if-no-files-found: ignore
