[package]
name = "fyrlet"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Blocking Rust client for Fyrlet: authenticated operations plus recoverable realtime subscriptions"
repository = "https://github.com/wsafight/fyrlet"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
ureq = "2.12"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
